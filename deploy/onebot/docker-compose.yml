services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      NAPCAT_UID: "0"
      NAPCAT_GID: "0"
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - /opt/apistation-finops/onebot/qq:/app/.config/QQ
      - /opt/apistation-finops/onebot/config:/app/napcat/config
      - /opt/apistation-finops/onebot/plugins:/app/napcat/plugins
    networks:
      - onebot
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  onebot:
    external: true
    name: "${APISTATION_ONEBOT_NETWORK:-apistation-finops-onebot}"
