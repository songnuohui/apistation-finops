<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>分组状态监控</title>
  <link rel="stylesheet" href="/monitor.css?v=0.2.0">
</head>
<body>
  <main class="monitor-shell">
    <header class="monitor-header">
      <div>
        <p class="monitor-kicker">ApiStation FinOps</p>
        <h1>分组状态监控</h1>
        <p class="monitor-subtitle">查看各分组当前计费倍率与运行状态</p>
      </div>
      <div class="monitor-actions">
        <span class="monitor-updated" id="updated-label">正在读取</span>
        <button class="icon-button" id="refresh-button" type="button" title="刷新监控数据" aria-label="刷新监控数据">
          <img src="/icons/refresh-cw.svg" alt="">
        </button>
      </div>
    </header>
    <section class="monitor-board" aria-live="polite">
      <div class="monitor-toolbar">
        <div>
          <strong id="group-count">分组</strong>
          <span id="status-summary">正在读取监控状态</span>
        </div>
        <span class="monitor-refresh-note">自动刷新配置中</span>
      </div>
      <div class="group-grid" id="group-grid">
        <div class="monitor-loading"><span></span>正在读取监控数据</div>
      </div>
    </section>
  </main>
  <script type="module" src="/monitor.js?v=0.2.0"></script>
</body>
</html>
