<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>ApiStation FinOps</title>
  <link rel="stylesheet" href="/styles.css?v=0.1.1">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">AF</span>
        <div><strong>ApiStation FinOps</strong><small>成本与用量中心</small></div>
      </div>
      <nav id="nav" aria-label="主导航">
        <section class="nav-group" aria-labelledby="nav-analysis">
          <h2 class="nav-group-label" id="nav-analysis">经营分析</h2>
          <button class="nav-item active" data-page="overview"><img src="/icons/layout-dashboard.svg" alt="">经营总览</button>
          <button class="nav-item" data-page="users"><img src="/icons/users.svg" alt="">用户账务与利润</button>
          <button class="nav-item" data-page="usage"><img src="/icons/chart-no-axes-combined.svg" alt="">用量与扣费</button>
        </section>
        <section class="nav-group" aria-labelledby="nav-cost">
          <h2 class="nav-group-label" id="nav-cost">资源与成本</h2>
          <button class="nav-item" data-page="accounts"><img src="/icons/landmark.svg" alt="">账号台账与成本</button>
          <button class="nav-item" data-page="suppliers"><img src="/icons/server-cog.svg" alt="">供应商与采购</button>
          <button class="nav-item" data-page="costs"><img src="/icons/tags.svg" alt="">成本核算</button>
        </section>
        <section class="nav-group" aria-labelledby="nav-funds">
          <h2 class="nav-group-label" id="nav-funds">资金治理</h2>
          <button class="nav-item" data-page="funds"><img src="/icons/wallet-cards.svg" alt="">充值与资金</button>
          <button class="nav-item" data-page="reconciliation"><img src="/icons/scale.svg" alt="">对账中心</button>
        </section>
        <section class="nav-group" aria-labelledby="nav-system">
          <h2 class="nav-group-label" id="nav-system">系统治理</h2>
          <button class="nav-item" data-page="sync"><img src="/icons/database-zap.svg" alt="">数据同步</button>
          <button class="nav-item" data-page="alerts"><img src="/icons/triangle-alert.svg" alt="">告警中心</button>
        </section>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-status" id="sync-status"><span class="status-dot"></span><div><strong id="sync-label">正在连接</strong><small id="sync-detail">读取同步状态</small></div></div>
        <button class="sidebar-action" id="sidebar-refresh"><img src="/icons/refresh-cw.svg" alt="">刷新数据</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="title-group">
          <button class="icon-button mobile-only" id="menu-button" title="打开菜单"><img src="/icons/panel-left-open.svg" alt=""></button>
          <div><span class="eyebrow">管理控制台 · 财务核算</span><h1 id="page-title">经营总览</h1><p id="page-subtitle">现金、消耗、成本与毛利</p></div>
        </div>
        <div class="toolbar">
          <span class="mode-badge" id="mode-badge">连接中</span>
          <div class="range-tabs" id="range-tabs" role="group" aria-label="统计周期">
            <button type="button" data-range="today" aria-pressed="false">今天</button>
            <button type="button" class="active" data-range="7d" aria-pressed="true">近 7 天</button>
            <button type="button" data-range="30d" aria-pressed="false">近 30 天</button>
            <button type="button" data-range="month" aria-pressed="false">本月</button>
          </div>
          <label class="range-control mobile-range"><span>周期</span><select id="range-select"><option value="today">今天</option><option value="7d" selected>近 7 天</option><option value="30d">近 30 天</option><option value="month">本月</option></select></label>
          <button class="icon-button" id="refresh-button" title="刷新数据"><img src="/icons/refresh-cw.svg" alt=""></button>
          <button class="icon-button" id="export-button" title="导出当前数据"><img src="/icons/download.svg" alt=""></button>
          <div class="user-chip" aria-label="当前管理员">
            <span class="user-avatar"><img src="/icons/users.svg" alt=""></span>
            <span class="user-copy"><strong>财务管理员</strong><small>admin</small></span>
          </div>
        </div>
      </header>
      <div class="content" id="content" aria-live="polite"><div class="loading"><span></span>正在读取经营数据</div></div>
    </main>
  </div>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title">新增记录</h2><button class="icon-button" id="modal-close" title="关闭"><img src="/icons/x.svg" alt=""></button></header>
      <form id="modal-form"></form>
    </section>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js?v=0.1.1"></script>
</body>
</html>
