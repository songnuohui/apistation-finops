<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f8fc">
  <title>登录 - ApiStation FinOps</title>
  <link rel="stylesheet" href="/login.css?v=0.2.1">
</head>
<body>
  <main class="login-shell">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand">
        <span class="brand-mark">AF</span>
        <span>ApiStation FinOps</span>
      </div>
      <div class="intro">
        <h1 id="login-title">管理员登录</h1>
      </div>
      <form id="login-form">
        <label class="field">
          <span>管理员邮箱</span>
          <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span>密码</span>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <label class="field" id="totp-field" hidden>
          <span>双重验证代码</span>
          <input id="totp-code" name="totpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
        </label>
        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button class="submit-button" id="submit-button" type="submit">登录</button>
      </form>
    </section>
  </main>
  <script type="module" src="/login.js?v=0.2.1"></script>
</body>
</html>
